<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roteiro de Homologação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233D; --ink-soft:#4B5768;
    --paper:#EDF1EA; --paper-card:#FFFFFF;
    --line:#CBD1C3; --line-strong:#A9B1A0;
    --forest:#2F6F4E; --forest-bg:#E1EEE5;
    --brick:#A63B2E; --brick-bg:#F4E2DE;
    --amber:#B8842E; --amber-bg:#F4EAD3;
    --stone:#8B8D82; --stone-dark:#65675E; --stone-bg:#E6E6DF;
    --gold:#9C7A2E;
    --focus:#2F6F4E;
    --radius:10px;
    --shadow:0 1px 2px rgba(22,35,61,.06), 0 4px 14px rgba(22,35,61,.07);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .app-shell{max-width:1360px;margin:0 auto;padding:22px 24px 70px;}
  h1,h2,h3{font-family:'Source Serif 4',serif;margin:0;}
  button{cursor:pointer;font-family:inherit;}
  select,input,textarea{font-family:inherit;}
  a{color:inherit;}

  /* Topbar */
  .topbar{background:var(--ink);color:#fff;border-radius:var(--radius);padding:20px 26px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;box-shadow:var(--shadow);}
  .topbar .title-block h1{font-weight:700;font-size:1.45rem;letter-spacing:.01em;}
  .topbar .title-block .subtitle{font-size:.82rem;opacity:.72;margin-top:4px;}
  .topbar .user-chip{font-size:.75rem;opacity:.8;margin-top:8px;}
  .topbar .user-chip button{background:none;border:none;color:var(--gold);text-decoration:underline;padding:0;font-size:.75rem;}
  .meta-grid{display:grid;grid-template-columns:auto auto;gap:5px 18px;font-family:'IBM Plex Mono',monospace;font-size:.74rem;align-content:start;}
  .meta-grid label{opacity:.65;align-self:center;}
  .meta-grid input{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:3px 7px;font-family:inherit;font-size:inherit;width:120px;}
  .meta-grid input::placeholder{color:rgba(255,255,255,.4);}

  /* Tabs */
  .tabs{display:flex;gap:2px;margin:20px 0 18px;border-bottom:1px solid var(--line-strong);}
  .tab-btn{background:none;border:none;padding:10px 18px;font-weight:500;font-size:.92rem;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s;}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--forest);}
  .tab-btn:hover{color:var(--ink);}

  /* Stat cards */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow);}
  .stat-card .num{font-weight:700;font-size:2rem;line-height:1;}
  .stat-card .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-top:5px;}
  .stat-card .bar-track{height:5px;border-radius:3px;background:var(--stone-bg);margin-top:11px;overflow:hidden;}
  .stat-card .bar-fill{height:100%;border-radius:3px;}
  .stamp{position:absolute;top:12px;right:14px;width:58px;height:58px;transform:rotate(-11deg);border:2.5px solid var(--c);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;opacity:.8;}
  .stamp::before{content:'';position:absolute;inset:4px;border:1px dashed var(--c);border-radius:50%;}
  .stamp span{font-family:'Source Serif 4',serif;font-weight:700;font-size:.52rem;color:var(--c);letter-spacing:.02em;line-height:1.05;}

  /* Sistema breakdown */
  .panel{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:20px;}
  .panel h3{font-size:1rem;margin-bottom:14px;}
  .sistema-row{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.84rem;}
  .sistema-row:last-child{border-bottom:none;}
  .sistema-row .bar-track{height:8px;background:var(--stone-bg);border-radius:4px;overflow:hidden;}
  .sistema-row .bar-fill{height:100%;background:var(--forest);}
  .sistema-row .pct{text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);}

  /* Toolbar / filters */
  .toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;align-items:center;}
  .toolbar .spacer{flex:1;}
  select,input[type=text],input[type=search]{font-size:.83rem;padding:7px 10px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;color:var(--ink);}
  select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
  label.chk{display:flex;align-items:center;gap:5px;font-size:.8rem;color:var(--ink-soft);}

  .btn{font-weight:500;font-size:.83rem;padding:8px 15px;border-radius:7px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);}
  .btn:hover{background:var(--paper);}
  .btn-primary{background:var(--forest);border-color:var(--forest);color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{border-color:transparent;background:none;color:var(--ink-soft);}
  .btn-danger{color:var(--brick);border-color:var(--brick);background:#fff;}

  /* Table */
  .table-wrap{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:900px;}
  th{text-align:left;background:var(--ink);color:#fff;padding:10px 12px;font-weight:500;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
  td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr.item-row{cursor:pointer;}
  tr.item-row:hover td{background:var(--paper);}
  tr.item-row.arquivado{opacity:.48;}
  .id-mono{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:.71rem;font-weight:500;white-space:nowrap;}
  .badge .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .muted{color:var(--ink-soft);}
  .pagination{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px 14px;font-size:.8rem;color:var(--ink-soft);}
  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state h3{margin-bottom:8px;color:var(--ink);}

  /* Drawer */
  .drawer-overlay{position:fixed;inset:0;background:rgba(22,35,61,.4);display:flex;justify-content:flex-end;z-index:60;}
  .drawer{width:440px;max-width:94vw;background:#fff;height:100%;overflow-y:auto;padding:26px;box-shadow:-10px 0 26px rgba(0,0,0,.18);animation:slidein .16s ease-out;}
  @keyframes slidein{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .drawer-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .drawer-header h2{font-size:1.1rem;}
  .drawer .item-path{font-size:.78rem;color:var(--ink-soft);margin-bottom:18px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-group{margin-bottom:13px;}
  .field-group label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:4px;}
  .field-group input,.field-group select,.field-group textarea{width:100%;padding:7px 10px;border:1px solid var(--line-strong);border-radius:7px;font-size:.85rem;}
  .field-group textarea{resize:vertical;min-height:52px;}
  .drawer-actions{display:flex;gap:8px;margin-top:18px;}
  .history-list{list-style:none;margin:16px 0 0;padding:14px 0 0;border-top:1px solid var(--line);}
  .history-list li{font-size:.76rem;color:var(--ink-soft);padding:6px 0;border-bottom:1px dashed var(--line);}
  .history-list li:last-child{border-bottom:none;}
  .history-list b{color:var(--ink);}
  .history-empty{font-size:.78rem;color:var(--stone);margin-top:14px;}

  /* Import view */
  .import-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
  .dropzone{border:2px dashed var(--line-strong);border-radius:var(--radius);padding:22px;text-align:center;background:var(--paper-card);}
  .dropzone p{font-size:.82rem;color:var(--ink-soft);margin:6px 0 14px;}
  textarea.paste-area{width:100%;min-height:160px;padding:10px;border:1px solid var(--line-strong);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;}
  .diff-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0;}
  .diff-card{background:var(--paper-card);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center;}
  .diff-card .num{font-size:1.35rem;font-weight:700;}
  .diff-card .lbl{font-size:.66rem;text-transform:uppercase;color:var(--ink-soft);margin-top:2px;}
  .diff-list{max-height:180px;overflow-y:auto;font-size:.78rem;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--paper-card);margin-bottom:14px;}
  .diff-list div{padding:3px 0;border-bottom:1px dashed var(--line);}
  .diff-list div:last-child{border-bottom:none;}

  /* Modal (identidade) */
  .modal-overlay{position:fixed;inset:0;background:rgba(22,35,61,.5);display:flex;align-items:center;justify-content:center;z-index:80;}
  .modal-box{background:#fff;border-radius:var(--radius);padding:28px;width:340px;max-width:90vw;box-shadow:var(--shadow);}
  .modal-box h2{font-size:1.15rem;margin-bottom:6px;}
  .modal-box p{font-size:.83rem;color:var(--ink-soft);margin:0 0 16px;}

  /* Toast */
  .toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:.83rem;box-shadow:var(--shadow);animation:fadeup .18s ease-out;z-index:100;}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:760px){
    .meta-grid{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    .diff-summary{grid-template-columns:repeat(2,1fr);}
    .import-grid{grid-template-columns:1fr;}
    .drawer{width:100vw;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>

function nowStamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function truncate(str, n) { str = String(str ?? ''); return str.length > n ? str.slice(0, n) + '…' : str; }
function uniqueSorted(arr) { return Array.from(new Set(arr.filter(Boolean))).sort((a, b) => a.localeCompare(b, 'pt-BR')); }

async function safeGet(key, shared) {

  catch (e) { return null; }
}
async function safeSet(key, value, shared) {
  try { await window.storage.set(key, JSON.stringify(value), shared); return true; }
  catch (e) { console.error('storage set failed', key, e); return false; }
}

/* ===================== CSV parsing ===================== */
function parseCSV(text, delimiter) {
  delimiter = delimiter || ';';
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === delimiter) { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function decodeBuffer(buffer) {
  const tryDecode = (enc) => { try { return new TextDecoder(enc, { fatal: false }).decode(buffer); } catch (e) { return null; } };
  const utf8 = tryDecode('utf-8');
  const replacementCount = utf8 ? (utf8.match(/\uFFFD/g) || []).length : Infinity;
  if (utf8 && replacementCount === 0) return utf8;
  const latin1 = tryDecode('windows-1252');
  return latin1 || utf8 || '';
}
function rowsToItems(rows) {
  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    const upper = rows[i].map(c => (c || '').trim().toUpperCase());
    if (upper.includes('ID') && upper.includes('SISTEMA') && upper.includes('STATUS')) { headerIdx = i; break; }
  }
  if (headerIdx === -1) return { items: [], error: 'Não encontrei a linha de cabeçalho (colunas ID, SISTEMA, STATUS...) no arquivo.' };
  const header = rows[headerIdx].map(c => (c || '').trim().toUpperCase());
  const colIndex = (name) => header.indexOf(name);
  const idx = {
    id: colIndex('ID'), sistema: colIndex('SISTEMA'),
    modulo: colIndex('MÓDULO') >= 0 ? colIndex('MÓDULO') : colIndex('MODULO'),
    tela: header.findIndex(h => h.startsWith('TELA')),
    cenario: colIndex('CENÁRIO') >= 0 ? colIndex('CENÁRIO') : colIndex('CENARIO'),
    requisitos: colIndex('REQUISITOS'),
    responsavel: colIndex('RESPONSÁVEL') >= 0 ? colIndex('RESPONSÁVEL') : colIndex('RESPONSAVEL'),
    status: colIndex('STATUS'), chamado: colIndex('CHAMADO'),
    statusChamado: header.findIndex(h => h.startsWith('STATUS CHAMADO')),
    observacao: colIndex('OBSERVAÇÃO') >= 0 ? colIndex('OBSERVAÇÃO') : colIndex('OBSERVACAO'),
    subsidio: colIndex('SUBSÍDIO') >= 0 ? colIndex('SUBSÍDIO') : colIndex('SUBSIDIO')
  };
  const items = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r || !r.length) continue;
    const rawId = (r[idx.id] || '').trim();
    if (!/^\d+$/.test(rawId)) continue;
    const get = (key) => (idx[key] >= 0 && r[idx[key]] !== undefined ? r[idx[key]].trim() : '');
    items.push({
      id: rawId, sistema: get('sistema'), modulo: get('modulo'), tela: get('tela'), cenario: get('cenario'),
      requisitos: get('requisitos'), responsavel: get('responsavel'), status: get('status').toUpperCase(),
      chamado: get('chamado'), statusChamado: get('statusChamado'), observacao: get('observacao'), subsidio: get('subsidio')
    });
  }
  return { items, error: null };
}
function computeDiff(oldItems, newItemsRaw) {
  const oldById = new Map(oldItems.filter(i => !i.arquivado).map(i => [i.id, i]));
  const newIds = new Set(newItemsRaw.map(i => i.id));
  const novos = newItemsRaw.filter(i => !oldById.has(i.id));
  const removidos = oldItems.filter(i => !i.arquivado && !newIds.has(i.id));
  const alterados = newItemsRaw.filter(i => {
    const old = oldById.get(i.id); if (!old) return false;
    return old.sistema !== i.sistema || old.modulo !== i.modulo || old.tela !== i.tela || old.cenario !== i.cenario || old.requisitos !== i.requisitos;
  });
  return { novos, removidos, alterados, preservados: newItemsRaw.length - novos.length };
}
function mergeImport(oldItems, newItemsRaw, user) {
  const oldById = new Map(oldItems.map(i => [i.id, i]));
  const ts = nowStamp(); const merged = []; const newIds = new Set(newItemsRaw.map(i => i.id));
  for (const raw of newItemsRaw) {
    const old = oldById.get(raw.id);
    if (!old) { merged.push({ ...raw, arquivado: false, history: [{ ts, user: user || 'sistema', text: 'Item incluído na importação.' }] }); continue; }
    const descrChanged = old.sistema !== raw.sistema || old.modulo !== raw.modulo || old.tela !== raw.tela || old.cenario !== raw.cenario || old.requisitos !== raw.requisitos;
    const updated = { ...old, sistema: raw.sistema, modulo: raw.modulo, tela: raw.tela, cenario: raw.cenario, requisitos: raw.requisitos, arquivado: false, history: old.history ? old.history.slice() : [] };
    if (descrChanged) updated.history.push({ ts, user: user || 'sistema', text: 'Descrição do item atualizada na nova importação.' });
    merged.push(updated);
  }
  for (const old of oldItems) {
    if (!newIds.has(old.id)) {
      const arq = { ...old, arquivado: true, history: (old.history || []).slice() };
      arq.history.push({ ts, user: user || 'sistema', text: 'Item não está mais presente na versão importada (arquivado).' });
      merged.push(arq);
    }
  }
  return merged;
}

/* ===================== Estatísticas ===================== */
function computeStats(items) {
  const ativos = items.filter(i => !i.arquivado);
  const total = ativos.length;
  const byStatus = {}; STATUS_ORDER.forEach(s => byStatus[s] = 0);
  ativos.forEach(i => { byStatus[i.status] = (byStatus[i.status] || 0) + 1; });
  const homologados = total - (byStatus[''] || 0);
  const pct = (n) => total ? Math.round((n / total) * 1000) / 10 : 0;
  return { total, byStatus, homologados, restantes: byStatus[''] || 0, pct };
}
function computeSistemaBreakdown(items) {
  const ativos = items.filter(i => !i.arquivado); const map = new Map();
  ativos.forEach(i => {
    const key = i.sistema || '(sem sistema)';
    if (!map.has(key)) map.set(key, { total: 0, testados: 0 });
    const entry = map.get(key); entry.total++; if (i.status) entry.testados++;
  });
  return Array.from(map.entries()).map(([sistema, v]) => ({ sistema, total: v.total, testados: v.testados, pct: v.total ? Math.round((v.testados / v.total) * 1000) / 10 : 0 })).sort((a, b) => b.total - a.total);
}

        <label for="m-inicio">Início</label><input id="m-inicio" type="date" value="${escapeHtml(m.dataInicio)}" oninput="updateMeta('dataInicio', this.value)">
        <label for="m-fim">Fim</label><input id="m-fim" type="date" value="${escapeHtml(m.dataFim)}" oninput="updateMeta('dataFim', this.value)">
      </div>
    </div>`;
}
function renderTabs() {
  const tabs = [['dashboard', 'Painel'], ['itens', 'Itens'], ['importar', 'Importar']];
  return `<div class="tabs">${tabs.map(([k, l]) => `<button class="tab-btn ${state.view === k ? 'active' : ''}" onclick="setView('${k}')">${l}</button>`).join('')}</div>`;
}

/* ===================== Dashboard ===================== */
function renderDashboardView() {
  if (!state.items.length) return renderEmptyState('Nenhum item carregado ainda', 'Importe sua planilha de homologação na aba "Importar" para começar a acompanhar o progresso.', 'importar');
  const stats = computeStats(state.items);
  const cards = [
    { key: 'restantes', label: 'Restantes', num: stats.restantes, color: 'var(--stone)', stampLabel: null },
    { key: 'FUNCIONA', label: STATUS_META['FUNCIONA'].label, num: stats.byStatus['FUNCIONA'], color: STATUS_META['FUNCIONA'].color, stampLabel: STATUS_META['FUNCIONA'].stampLabel },
    { key: 'FUNCIONA COM RESSALVAS', label: STATUS_META['FUNCIONA COM RESSALVAS'].label, num: stats.byStatus['FUNCIONA COM RESSALVAS'], color: STATUS_META['FUNCIONA COM RESSALVAS'].color, stampLabel: STATUS_META['FUNCIONA COM RESSALVAS'].stampLabel },
    { key: 'ERRO IMPEDITIVO', label: STATUS_META['ERRO IMPEDITIVO'].label, num: stats.byStatus['ERRO IMPEDITIVO'], color: STATUS_META['ERRO IMPEDITIVO'].color, stampLabel: STATUS_META['ERRO IMPEDITIVO'].stampLabel },
    { key: 'ITEM DESABILITADO', label: STATUS_META['ITEM DESABILITADO'].label, num: stats.byStatus['ITEM DESABILITADO'], color: STATUS_META['ITEM DESABILITADO'].color, stampLabel: STATUS_META['ITEM DESABILITADO'].stampLabel },
    { key: 'homologados', label: 'Homologados (total testado)', num: stats.homologados, color: 'var(--gold)', stampLabel: null }
  ];
  const statGrid = cards.map(c => {
    const pct = stats.pct(c.num);
    return `<div class="stat-card">
      ${c.stampLabel ? `<div class="stamp" style="--c:${c.color}"><span>${c.stampLabel}</span></div>` : ''}
      <div class="num" style="color:${c.color}">${c.num}</div>
      <div class="label">${c.label} · ${pct}%</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${c.color}"></div></div>
    </div>`;
  }).join('');
  const breakdown = computeSistemaBreakdown(state.items);
  const breakdownHtml = breakdown.map(b => `
    <div class="sistema-row">
      <div>${escapeHtml(b.sistema)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${b.pct}%"></div></div>
      <div class="pct">${b.testados}/${b.total} · ${b.pct}%</div>
    </div>`).join('');
  const arquivados = state.items.filter(i => i.arquivado).length;
  return `
    <div class="stat-grid">${statGrid}</div>
    <div class="panel">
      <h3>Progresso por sistema</h3>
      ${breakdownHtml}
    </div>
    ${arquivados ? `<div class="panel"><h3>Itens arquivados</h3><p class="muted" style="font-size:.85rem;margin:0">${arquivados} item(ns) não estão mais presentes na versão importada mais recente. Veja a aba "Itens" com o filtro "mostrar arquivados" marcado.</p></div>` : ''}
  `;
}

/* ===================== Itens: filtros e tabela ===================== */
function getFilteredItems() {
  const f = state.filters;
  return state.items.filter(i => {
    if (!f.mostrarArquivados && i.arquivado) return false;
    if (f.sistema && i.sistema !== f.sistema) return false;
    if (f.modulo && i.modulo !== f.modulo) return false;
    if (f.status !== '' && i.status !== f.status) return false;
    if (f.somentePendentes && i.status !== '') return false;
    if (f.responsavel && i.responsavel !== f.responsavel) return false;
    if (f.busca) {
      const q = f.busca.toLowerCase();
      const hay = `${i.id} ${i.tela} ${i.cenario} ${i.requisitos} ${i.modulo}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function renderItensView() {
  if (!state.items.length) return renderEmptyState('Nenhum item carregado ainda', 'Importe sua planilha de homologação na aba "Importar" para começar a acompanhar o progresso.', 'importar');
  const sistemas = uniqueSorted(state.items.map(i => i.sistema));
  const modulos = uniqueSorted(state.items.filter(i => !state.filters.sistema || i.sistema === state.filters.sistema).map(i => i.modulo));
  const responsaveis = uniqueSorted(state.items.map(i => i.responsavel));
  const f = state.filters;
  return `
    <div class="toolbar">
      <input type="search" placeholder="Buscar por tela, cenário, requisito..." value="${escapeHtml(f.busca)}" oninput="onFilterChange('busca', this.value)" style="min-width:220px">
      <select onchange="onFilterChange('sistema', this.value)">
        <option value="">Todos os sistemas</option>
        ${sistemas.map(s => `<option value="${escapeHtml(s)}" ${f.sistema === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
      </select>
      <select onchange="onFilterChange('modulo', this.value)">
        <option value="">Todos os módulos</option>
        ${modulos.map(m => `<option value="${escapeHtml(m)}" ${f.modulo === m ? 'selected' : ''}>${escapeHtml(m)}</option>`).join('')}
      </select>
      <select onchange="onFilterChange('status', this.value)">
        <option value="">Todos os status</option>
        ${STATUS_ORDER.map(s => `<option value="${s}" ${f.status === s ? 'selected' : ''}>${STATUS_META[s].label}</option>`).join('')}
      </select>
      <select onchange="onFilterChange('responsavel', this.value)">
        <option value="">Todos os responsáveis</option>
        ${responsaveis.map(r => `<option value="${escapeHtml(r)}" ${f.responsavel === r ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}
      </select>
      <label class="chk"><input type="checkbox" ${f.somentePendentes ? 'checked' : ''} onchange="onFilterChange('somentePendentes', this.checked)"> só pendentes</label>
      <label class="chk"><input type="checkbox" ${f.mostrarArquivados ? 'checked' : ''} onchange="onFilterChange('mostrarArquivados', this.checked)"> mostrar arquivados</label>
      <div class="spacer"></div>
      <button class="btn" onclick="openDrawer('new')">+ Novo item</button>
      <button class="btn" onclick="exportCSV()">Exportar CSV</button>
    </div>
    <div id="items-table-area">${itemsTableAreaHTML()}</div>
  `;
}
function itemsTableAreaHTML() {
  const filtered = getFilteredItems();
  const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
  state.page = Math.min(state.page, totalPages);
  const start = (state.page - 1) * state.pageSize;
  const pageItems = filtered.slice(start, start + state.pageSize);
  if (!filtered.length) {
    return `<div class="table-wrap"><div class="empty-state"><h3>Nenhum item corresponde aos filtros</h3><p>Tente limpar algum filtro.</p></div></div>`;
  }
  const rows = pageItems.map(i => {
    const sm = STATUS_META[i.status] || STATUS_META[''];
    return `<tr class="item-row ${i.arquivado ? 'arquivado' : ''}" onclick="openDrawer('${i.id}')">
      <td class="id-mono">#${i.id}</td>
      <td>${escapeHtml(i.sistema)}</td>
      <td>${escapeHtml(i.modulo)}</td>
      <td>${escapeHtml(truncate(i.tela, 40))}</td>
      <td>${escapeHtml(i.responsavel) || '<span class="muted">—</span>'}</td>
      <td><span class="badge" style="background:${sm.color}22;color:${sm.color}"><span class="dot" style="background:${sm.color}"></span>${sm.label}</span></td>
      <td>${escapeHtml(i.chamado) || '<span class="muted">—</span>'}</td>
    </tr>`;
  }).join('');
  return `
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Sistema</th><th>Módulo</th><th>Tela/Funcionalidade</th><th>Responsável</th><th>Status</th><th>Chamado</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="pagination">
        <span>${filtered.length} item(ns) · página ${state.page} de ${totalPages}</span>
        <button class="btn btn-ghost" ${state.page <= 1 ? 'disabled' : ''} onclick="changePage(${state.page - 1})">◀</button>
        <button class="btn btn-ghost" ${state.page >= totalPages ? 'disabled' : ''} onclick="changePage(${state.page + 1})">▶</button>
      </div>
    </div>`;
}
function refreshItemsTableArea() {
  const el = document.getElementById('items-table-area');
  if (el) el.innerHTML = itemsTableAreaHTML();
}
function onFilterChange(key, value) {
  state.filters[key] = value;
  state.page = 1;
  if (key === 'sistema') { state.filters.modulo = ''; render(); return; }
  refreshItemsTableArea();
}
function changePage(p) { state.page = p; refreshItemsTableArea(); }

/* ===================== Empty state ===================== */
function renderEmptyState(title, msg, gotoView) {
  return `<div class="panel empty-state">
    <h3>${title}</h3>
    <p>${msg}</p>
    ${gotoView ? `<button class="btn btn-primary" onclick="setView('${gotoView}')">Ir para Importar</button>` : ''}
  </div>`;
}

/* ===================== Drawer (editar/criar item) ===================== */
function nextId() {
  const nums = state.items.map(i => parseInt(i.id, 10)).filter(n => !isNaN(n));
  return String((nums.length ? Math.max(...nums) : 0) + 1);
}
function renderDrawer() {
  const isNew = state.editingId === 'new';
  const item = isNew ? { id: nextId(), sistema: '', modulo: '', tela: '', cenario: '', requisitos: '', responsavel: '', status: '', chamado: '', statusChamado: '', observacao: '', subsidio: '', history: [] } : state.items.find(i => i.id === state.editingId);
  if (!item) { state.editingId = null; return ''; }
  const analistasOpts = state.analistas.map(a => `<option value="${escapeHtml(a)}">`).join('');
  const history = (item.history || []).slice().reverse();
  return `
    <div class="drawer-overlay" onclick="if(event.target===this) closeDrawer()">
      <div class="drawer">
        <div class="drawer-header">
          <h2>${isNew ? 'Novo item' : `Item #${item.id}`}</h2>
          <button class="btn btn-ghost" onclick="closeDrawer()">Fechar</button>
        </div>
        <div class="item-path">${isNew ? 'Adicionar item de teste avulso' : escapeHtml([item.sistema, item.modulo].filter(Boolean).join(' · '))}</div>
        <form id="drawer-form" onsubmit="return false">
          <div class="field-row">
            <div class="field-group"><label>Sistema</label><input name="sistema" value="${escapeHtml(item.sistema)}"></div>
            <div class="field-group"><label>Módulo</label><input name="modulo" value="${escapeHtml(item.modulo)}"></div>
          </div>
          <div class="field-group"><label>Tela/Funcionalidade</label><input name="tela" value="${escapeHtml(item.tela)}"></div>
          <div class="field-group"><label>Cenário</label><textarea name="cenario">${escapeHtml(item.cenario)}</textarea></div>
          <div class="field-group"><label>Requisitos</label><input name="requisitos" value="${escapeHtml(item.requisitos)}"></div>
          <div class="field-row">
            <div class="field-group">
              <label>Status</label>
              <select name="status">${STATUS_ORDER.map(s => `<option value="${s}" ${item.status === s ? 'selected' : ''}>${STATUS_META[s].label}</option>`).join('')}</select>
            </div>
            <div class="field-group">
              <label>Responsável</label>
              <input name="responsavel" list="analistas-list" value="${escapeHtml(item.responsavel)}">
              <datalist id="analistas-list">${analistasOpts}</datalist>
            </div>
          </div>
          <div class="field-row">
            <div class="field-group"><label>Chamado</label><input name="chamado" value="${escapeHtml(item.chamado)}" placeholder="ex: JIRA-1234"></div>
            <div class="field-group"><label>Status do chamado</label><input name="statusChamado" value="${escapeHtml(item.statusChamado)}" placeholder="ex: Em análise"></div>
          </div>
          <div class="field-group"><label>Observação</label><textarea name="observacao">${escapeHtml(item.observacao)}</textarea></div>
          <div class="field-group"><label>Subsídio</label><textarea name="subsidio">${escapeHtml(item.subsidio)}</textarea></div>
          <div class="drawer-actions">
            <button class="btn btn-primary" onclick="saveItemEdit('${item.id}', ${isNew})">Salvar</button>
            <button class="btn btn-ghost" onclick="closeDrawer()">Cancelar</button>
          </div>
        </form>
        ${!isNew ? (history.length
          ? `<ul class="history-list">${history.map(h => `<li><b>${escapeHtml(h.ts)}</b> — ${escapeHtml(h.user)}: ${escapeHtml(h.text)}</li>`).join('')}</ul>`
          : `<div class="history-empty">Sem alterações registradas ainda.</div>`) : ''}
      </div>
    </div>`;
}
function openDrawer(id) {
  if (!state.currentUser) { alert('Informe seu nome de analista antes de editar itens.'); return; }
  state.editingId = id;
  render();
}
function closeDrawer() { state.editingId = null; render(); }

async function saveItemEdit(id, isNew) {
  const form = document.getElementById('drawer-form');
  const fd = new FormData(form);
  const values = {};
  ['sistema', 'modulo', 'tela', 'cenario', 'requisitos', 'status', 'responsavel', 'chamado', 'statusChamado', 'observacao', 'subsidio'].forEach(k => values[k] = (fd.get(k) || '').toString());
  const ts = nowStamp();
  const user = state.currentUser || 'sistema';

  if (isNew) {
    const newItem = { id: nextId(), ...values, arquivado: false, history: [{ ts, user, text: 'Item criado manualmente.' }] };
    state.items.push(newItem);
  } else {
    const idx = state.items.findIndex(i => i.id === id);
    if (idx === -1) return;
    const old = state.items[idx];
    const history = (old.history || []).slice();
    Object.keys(values).forEach(key => {
      const oldVal = (old[key] || '').toString();
      const newVal = values[key];
      if (oldVal !== newVal) {
        const label = TRACKED_LABELS[key] || key;
        history.push({ ts, user, text: `${label} alterado: "${truncate(oldVal, 40) || '—'}" → "${truncate(newVal, 40) || '—'}"` });
      }
    });
    state.items[idx] = { ...old, ...values, history };
  }
  if (values.responsavel && !state.analistas.includes(values.responsavel)) {
    state.analistas.push(values.responsavel);
    await persistAnalistas();
  }
  await persistItems();
  state.editingId = null;
  render();
  showToast('Alterações salvas.');
}

/* ===================== Identidade ===================== */
function renderIdentityModal() {
  const opts = state.analistas.map(a => `<option value="${escapeHtml(a)}">`).join('');
  return `
    <div class="modal-overlay">
      <div class="modal-box">
        <h2>Quem é você?</h2>
        <p>Seu nome fica associado às atualizações que você fizer nos itens.</p>
        <div class="field-group">
          <input id="identity-input" list="analistas-list-modal" placeholder="Seu nome" onkeydown="if(event.key==='Enter') confirmarIdentidade()">
          <datalist id="analistas-list-modal">${opts}</datalist>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="confirmarIdentidade()">Entrar</button>
      </div>
    </div>`;
}
async function confirmarIdentidade() {
  const val = document.getElementById('identity-input').value.trim();
  if (!val) return;
  state.currentUser = val;
  if (!state.analistas.includes(val)) state.analistas.push(val);
  await persistUser();
  await persistAnalistas();
  render();
}
function trocarAnalista() { state.currentUser = ''; render(); }

/* ===================== Importar ===================== */
function renderImportView() {
  return `
    <div class="import-grid">
      <div>
        <div class="dropzone">
          <h3>Importar nova versão da planilha</h3>
          <p>Envie o arquivo .csv exportado da sua planilha (mesmo layout de colunas: ID, SISTEMA, MÓDULO, TELA/FUNCIONALIDADE, CENÁRIO, REQUISITOS, RESPONSÁVEL, STATUS, CHAMADO, STATUS CHAMADO, OBSERVAÇÃO, SUBSÍDIO), ou cole o conteúdo abaixo.</p>
          <input type="file" accept=".csv" id="file-input" onchange="onImportFileChange(this)">
        </div>
        <div class="field-group" style="margin-top:14px">
          <label>Ou cole o conteúdo do CSV aqui</label>
          <textarea class="paste-area" id="paste-area" oninput="importState.rawText=this.value">${escapeHtml(importState.rawText)}</textarea>
        </div>
        <div class="field-group">
          <label>Rótulo desta versão</label>
          <input id="version-label" value="${escapeHtml(importState.versionLabel)}" placeholder="ex: 5.1" oninput="importState.versionLabel=this.value">
        </div>
        <button class="btn btn-primary" onclick="onAnalisarClick()">Analisar</button>
      </div>
      <div>
        ${renderImportPreview()}
      </div>
    </div>
  `;
}
function renderImportPreview() {
  if (importState.error) return `<div class="panel"><p style="color:var(--brick)">${escapeHtml(importState.error)}</p></div>`;
  if (!importState.diff) return `<div class="panel empty-state"><p>A prévia da importação aparece aqui depois de clicar em "Analisar".</p></div>`;
  const d = importState.diff;
  return `
    <div class="panel">
      <h3>Prévia da importação</h3>
      <div class="diff-summary">
        <div class="diff-card"><div class="num" style="color:var(--forest)">${d.novos.length}</div><div class="lbl">Novos</div></div>
        <div class="diff-card"><div class="num" style="color:var(--brick)">${d.removidos.length}</div><div class="lbl">Removidos</div></div>
        <div class="diff-card"><div class="num" style="color:var(--amber)">${d.alterados.length}</div><div class="lbl">Descrição alterada</div></div>
        <div class="diff-card"><div class="num" style="color:var(--ink-soft)">${d.preservados}</div><div class="lbl">Preservados</div></div>
      </div>
      ${d.novos.length ? `<div class="diff-list">${d.novos.slice(0, 30).map(i => `<div>#${i.id} — ${escapeHtml(i.sistema)} · ${escapeHtml(truncate(i.tela, 40))}</div>`).join('')}${d.novos.length > 30 ? `<div class="muted">+ ${d.novos.length - 30} outros...</div>` : ''}</div>` : ''}
      <button class="btn btn-primary" onclick="onConfirmarImport()">Confirmar importação</button>
    </div>
  `;
}
async function onImportFileChange(input) {
  const file = input.files[0];
  if (!file) return;
  const buffer = await file.arrayBuffer();
  const text = decodeBuffer(buffer);
  importState.rawText = text;
  const ta = document.getElementById('paste-area');
  if (ta) ta.value = text;
}
function onAnalisarClick() {
  const text = importState.rawText;
  if (!text || !text.trim()) { importState.error = 'Cole o conteúdo do CSV ou selecione um arquivo antes de analisar.'; importState.diff = null; render(); return; }
  const rows = parseCSV(text, ';');
  const { items, error } = rowsToItems(rows);
  if (error) { importState.error = error; importState.diff = null; render(); return; }
  importState.error = null;
  importState.parsedItems = items;
  importState.diff = computeDiff(state.items, items);
  render();
}
async function onConfirmarImport() {
  if (!importState.parsedItems) return;
  state.items = mergeImport(state.items, importState.parsedItems, state.currentUser);
  state.meta.versao = importState.versionLabel || state.meta.versao;
  await persistItems();
  await persistMeta();
  importState = { rawText: '', parsedItems: null, diff: null, versionLabel: '', error: null };
  state.view = 'dashboard';
  render();
  showToast('Importação concluída.');
}

/* ===================== Export ===================== */
function exportCSV() {
  const header = ['ID', 'SISTEMA', 'MÓDULO', 'TELA/FUNCIONALIDADE', 'CENÁRIO', 'REQUISITOS', 'RESPONSÁVEL', 'STATUS', 'CHAMADO', 'STATUS CHAMADO', 'OBSERVAÇÃO', 'SUBSÍDIO', 'ARQUIVADO'];
  const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [header.join(';')];
  state.items.forEach(i => {
    lines.push([i.id, i.sistema, i.modulo, i.tela, i.cenario, i.requisitos, i.responsavel, i.status, i.chamado, i.statusChamado, i.observacao, i.subsidio, i.arquivado ? 'SIM' : ''].map(esc).join(';'));
  });
  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `roteiro_homologacao_${state.meta.versao || 'atual'}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===================== Meta ===================== */
function updateMeta(key, value) { state.meta[key] = value; persistMeta(); }

/* ===================== Nav / toast ===================== */
function setView(v) { state.view = v; state.page = 1; render(); }
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

/* ===================== Init ===================== */
async function seedIfEmpty() {
  if (state.items.length) return; // já existem dados salvos (de uso anterior), não sobrescreve
  const rows = parseCSV(SEED_CSV, ';');
  const { items, error } = rowsToItems(rows);
  if (error || !items.length) return;
  const ts = nowStamp();
  state.items = items.map(i => ({ ...i, arquivado: false, history: [{ ts, user: 'sistema', text: 'Item carregado da base inicial (planilha SAJ5).' }] }));
  if (!state.meta.versao) state.meta.versao = '5.0';
  await persistItems();
  await persistMeta();
}
async function init() {
  render(); // loading shell instantly
  await loadAll();
  await seedIfEmpty();
  render();
}
init();
